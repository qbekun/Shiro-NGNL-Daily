name: Shiro Daily

on:
  schedule:
     - cron: "7 6 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Send daily image
        run: node index.js
        env:
          API_KEY: ${{ secrets.API_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
          WEBHOOK: ${{ secrets.WEBHOOK }}

      - name: Save seen list
        run: |
          git config user.name "Shiro"
          git config user.email "bot@bot"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "update seen list"
            git push
          fi
